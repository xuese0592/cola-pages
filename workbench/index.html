<title>六域工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f0f2f5;color:#1a1a2e;height:100vh;display:flex;flex-direction:column}
header{background:#fff;border-bottom:1px solid #e8e8e8;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;flex-shrink:0;z-index:10}
.logo{font-size:18px;font-weight:700}.logo span{color:#f59e0b;margin-right:6px}
.persona-bar{display:flex;gap:2px}
.persona-btn{padding:8px 16px;border:none;background:transparent;border-radius:8px;cursor:pointer;font-size:13px;color:#666;transition:all .2s;white-space:nowrap}
.persona-btn:hover{background:#f5f3ff;color:#4f46e5}
.persona-btn.active{background:#4f46e5;color:#fff}
.persona-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:2px}
.clock{font-size:12px;color:#999}
main{display:flex;flex:1;overflow:hidden}
.sidebar{width:180px;background:#fff;border-right:1px solid #e8e8e8;padding:16px 12px;display:flex;flex-direction:column;gap:4px;flex-shrink:0;overflow-y:auto}
.sidebar-header{font-size:11px;color:#999;letter-spacing:1px;padding:4px 8px;margin-bottom:4px}
.kanban-btn{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border:none;background:transparent;border-radius:6px;cursor:pointer;font-size:13px;color:#444;text-align:left;transition:all .15s}
.kanban-btn:hover{background:#f5f3ff}
.kanban-btn.active{background:#ede9fe;color:#4f46e5;font-weight:600}
.kanban-btn .count{font-size:11px;background:#e8e8e8;color:#666;padding:1px 7px;border-radius:10px;min-width:22px;text-align:center}
.kanban-btn.active .count{background:#4f46e5;color:#fff}
.sidebar-footer{font-size:10px;color:#bbb;padding:8px;margin-top:auto;border-top:1px solid #f0f0f0;padding-top:12px}
.content{flex:1;overflow-y:auto;padding:20px}
.search-bar{display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.search-input{flex:1;max-width:320px;padding:8px 14px;border:1px solid #d9d9d9;border-radius:8px;font-size:13px;outline:none}
.search-input:focus{border-color:#4f46e5}
.filter-tags{display:flex;gap:6px;flex-wrap:wrap}
.filter-tag{padding:4px 12px;border:1px solid #d9d9d9;border-radius:14px;font-size:12px;cursor:pointer;background:#fff;color:#666}
.filter-tag:hover,.filter-tag.active{background:#4f46e5;color:#fff;border-color:#4f46e5}
.summary{font-size:12px;color:#999;margin-bottom:12px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:#fff;border-radius:10px;padding:16px;border:1px solid #f0f0f0;transition:all .2s;cursor:pointer}
.card:hover{border-color:#c4b5fd;box-shadow:0 2px 8px rgba(79,70,229,.08)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card-title{font-size:14px;font-weight:600;line-height:1.4;flex:1}
.card-badges{display:flex;gap:4px;flex-shrink:0;margin-left:8px}
.badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.badge-tag{background:#f5f3ff;color:#6d5dfc}
.badge-status{background:#e6f7ff;color:#1890ff}
.card-meta{font-size:12px;color:#999;margin-top:4px;display:flex;gap:12px}
.card-desc{font-size:12px;color:#666;margin-top:8px;line-height:1.5}
.card-stages{display:flex;gap:4px;margin-top:10px}
.stage-dot{width:8px;height:8px;border-radius:50%;background:#d9d9d9}
.stage-dot.done{background:#52c41a}
.stage-dot.active{background:#4f46e5;animation:pulse 1.5s infinite}
.stage-dot.blocked{background:#ff4d4f}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.empty-state{text-align:center;padding:60px 20px;color:#bbb;font-size:14px}
.supplier-section{margin-top:24px;border-top:1px solid #e8e8e8;padding-top:16px}
.supplier-section h3{font-size:15px;font-weight:600;margin-bottom:12px}
.supplier-table{width:100%;border-collapse:collapse;font-size:12px;background:#fff;border-radius:8px;overflow:hidden}
.supplier-table th{background:#f8f9fb;color:#555;font-weight:600;padding:10px 12px;text-align:left;border-bottom:2px solid #e8e8e8;white-space:nowrap}
.supplier-table td{padding:9px 12px;border-bottom:1px solid #f0f0f0;color:#444}
.supplier-table tr:hover td{background:#fafbff}
.export-btn{float:right;padding:6px 16px;background:#4f46e5;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;margin-bottom:8px}
.export-btn:hover{background:#4338ca}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
.overlay.hidden{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:14px;width:680px;max-height:85vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.15);animation:slideUp .25s}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:flex-start}
.modal-title{font-size:18px;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:8px;border:none;background:#f5f5f5;cursor:pointer;font-size:16px;color:#666;display:flex;align-items:center;justify-content:center;transition:all .15s}
.modal-close:hover{background:#e8e8e8;color:#333}
.modal-body{padding:20px 24px 24px}
.modal-meta{display:flex;gap:16px;margin-bottom:20px;font-size:13px;color:#888}
.modal-desc{font-size:13px;color:#555;line-height:1.6;margin-bottom:20px;padding:12px;background:#f9fafb;border-radius:8px}
.stage-stepper{display:flex;align-items:flex-start;position:relative}
.stage-step{flex:1;text-align:center;position:relative}
.stage-step .node{width:36px;height:36px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;border:3px solid #d9d9d9;background:#fff;color:#bbb;transition:all .3s}
.stage-step.done .node{border-color:#52c41a;background:#f6ffed;color:#52c41a}
.stage-step.active .node{border-color:#4f46e5;background:#ede9fe;color:#4f46e5;box-shadow:0 0 0 4px rgba(79,70,229,.12)}
.stage-step.blocked .node{border-color:#ff4d4f;background:#fff2f0;color:#ff4d4f}
.stage-step .label{font-size:13px;font-weight:600;color:#333;margin-bottom:4px}
.stage-step.done .label{color:#52c41a}
.stage-step.active .label{color:#4f46e5}
.stage-step.blocked .label{color:#ff4d4f}
.stage-step .date{font-size:11px;color:#999;margin-bottom:2px}
.stage-step .note{font-size:11px;color:#777;line-height:1.4;max-width:120px;margin:0 auto}
.stage-line{position:absolute;top:18px;left:calc(50% + 18px);width:calc(100% - 36px);height:2px;background:#e8e8e8;z-index:-1}
.stage-step:last-child .stage-line{display:none}
.stage-step.done .stage-line{background:#52c41a}
.stage-step.active .stage-line{background:linear-gradient(90deg,#52c41a,#e8e8e8)}
</style>
</head>

<script>
var DATA=JSON.parse(document.getElementById("__data").textContent);
(function(){
var data=DATA;
var state={personaIdx:0,kanban:"all",search:"",filterTags:new Set()};
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function render(){
 var p=data.personas[state.personaIdx];
 var items=p.items||[];
 var kanbans=p.kanbans||[];
 var filtered=items.slice();
 if(state.kanban!=="all") filtered=filtered.filter(function(i){return i.kanban===state.kanban;});
 if(state.search) filtered=filtered.filter(function(i){return (i.title||"").indexOf(state.search)>=0||(i.desc||"").indexOf(state.search)>=0||(i.tags||"").indexOf(state.search)>=0;});
 if(state.filterTags.size) filtered=filtered.filter(function(i){return state.filterTags.has(i.tags);});

 var bar=document.getElementById("personaBar");
 bar.innerHTML="";
 for(var pi=0;pi<data.personas.length;pi++){
   var pp=data.personas[pi];
   bar.innerHTML+='<button class="persona-btn'+(pi===state.personaIdx?" active":"")+'" onclick="switchPersona('+pi+')">'+(pp.avatar?'<img src="'+pp.avatar+'" class="persona-avatar">':esc(pp.icon)+' ')+esc(pp.char)+' · '+esc(pp.name)+'</button>';
 }

 var kl=document.getElementById("kanbanList");
 var allCount=items.length;
 var h='<button class="kanban-btn'+(state.kanban==="all"?" active":"")+'" onclick="switchKanban(\'all\')"><span>全部条目</span><span class="count">'+allCount+'</span></button>';
 for(var ki=0;ki<kanbans.length;ki++){
   var kn=kanbans[ki];
   var cnt=0;
   for(var ci=0;ci<items.length;ci++){if(items[ci].kanban===kn)cnt++;}
   h+='<button class="kanban-btn'+(state.kanban===kn?" active":"")+'" onclick="switchKanban(\''+esc(kn)+'\')"><span>'+esc(kn)+'</span><span class="count">'+cnt+'</span></button>';
 }

 var allTags=[],seen={};
 for(var ti=0;ti<filtered.length;ti++){var tg=filtered[ti].tags;if(tg&&!seen[tg]){seen[tg]=true;allTags.push(tg);}}

 var cards="";

   }

   for(var si=0;si<p.supplierDB.length;si++){
     var s=p.supplierDB[si];
     ch+='<tr><td>'+esc(s.name)+'</td><td>'+esc(s.contact)+'</td><td>'+esc(s.phone)+'</td><td>'+esc(s.addr)+'</td><td>'+esc(s.direction)+'</td><td>'+esc(s.projects)+'</td><td>'+esc(s.note)+'</td></tr>';
   }
   ch+='</tbody></table></div>';
 }
 ct.innerHTML=ch;
}

window.openDetail=function(id){
 var item=null,items=[];
 for(var i=0;i<data.personas.length;i++){
   for(var j=0;j<(data.personas[i].items||[]).length;j++){items.push(data.personas[i].items[j]);}
 }
 for(var k=0;k<items.length;k++){if(items[k].id===id){item=items[k];break;}}
 if(!item) return;
 var stages=item.stages||[];
 var stageLabels=["立项","采购","实施","试运行","验收"];
 var statusIcon={completed:"✔",in_progress:"▶",blocked:"✖",pending:"—"};
 var stepper="";
 for(var si=0;si<5;si++){
   var s=stages[si]||{name:stageLabels[si],status:"pending",date:"—",note:""};
   var cls=s.status==="completed"?"done":s.status==="in_progress"?"active":s.status==="blocked"?"blocked":"";
   stepper+='<div class="stage-step '+cls+'"><div class="stage-line"></div><div class="node">'+statusIcon[s.status]+'</div><div class="label">'+esc(s.name)+'</div><div class="date">'+esc(s.date)+'</div><div class="note">'+esc(s.note)+'</div></div>';
 }
 var modal=document.getElementById("modal");
 modal.innerHTML='<div class="modal-header"><div><div class="modal-title">'+esc(item.title)+'</div><div class="modal-meta"><span>📋 '+esc(item.kanban||"")+'</span><span>🏷 '+esc(item.tags||"")+'</span><span>👤 '+esc(item.lead||"赵鹏")+'</span><span>📅 '+esc(item.date||"")+'</span></div></div><button class="modal-close" onclick="closeDetail()">✕</button></div><div class="modal-body"><div class="modal-desc">'+(item.desc||"暂无描述")+'</div><div class="stage-stepper">'+stepper+'</div></div>';
 document.getElementById("overlay").classList.remove("hidden");
};
window.closeDetail=function(){
 document.getElementById("overlay").classList.add("hidden");
};
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeDetail();});

window.exportCSV=function(){
 var p=data.personas[state.personaIdx];
 if(!p.supplierDB) return;
 var csv="﻿公司名称,联系人,电话,地址,涉及方向,相关项目,备注\n";
 for(var i=0;i<p.supplierDB.length;i++){
   var s=p.supplierDB[i];
   csv+=[s.name,s.contact,s.phone,s.addr,s.direction,s.projects,s.note].map(function(v){return '"'+(v||"").replace(/"/g,'""')+'"';}).join(",")+"\n";
 }
 var blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
 var url=URL.createObjectURL(blob);
 var a=document.createElement("a");
 a.href=url;a.download="供应商库_"+new Date().toISOString().slice(0,10)+".csv";
 a.click();URL.revokeObjectURL(url);
};

window.switchPersona=function(i){state.personaIdx=i;state.kanban="all";state.search="";state.filterTags=new Set();render();};
window.switchKanban=function(k){state.kanban=k;render();};
window.setSearch=function(v){state.search=v;render();};
window.toggleTag=function(t){if(state.filterTags.has(t))state.filterTags.delete(t);else state.filterTags.add(t);render();};

function tick(){document.getElementById("clock").textContent=new Date().toLocaleString("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",weekday:"short"});}
tick();setInterval(tick,30000);
render();
})();
</script>
</body>
</html>
